<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hallway Canvas</title>
    <link rel="stylesheet" href="main.css">
    <style>
        /* Simple inline style for the clean game-start modal overlay */
        .start-game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
        .start-game-btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background: #28a745;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease;
        }
        .start-game-btn:hover {
            background: #218838;
        }
        .start-game-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="startGameModal" class="start-game-overlay">
        <button id="startGameModalBtn" class="start-game-btn">Start Game</button>
    </div>
    
    <div class="container" id="mainContainer">
        <div class="minimap-overlay" id="minimapOverlay" tabindex="0">
            <canvas id="minimapCanvas"></canvas>
        </div>

<div class="diagnostic-modal-panel" id="stateOverlay" tabindex="0">
    <div class="panel-header">
        <span>System State Monitor</span>
        <button class="panel-copy-btn" id="copyStateBtn">Copy All</button>
    </div>
    <div class="panel-content" id="statePanelContent"></div>
</div>

<div class="diagnostic-modal-panel" id="historyOverlay" tabindex="0">
    <div class="panel-header">
        <span>Navigation History Tracking</span>
        <button class="panel-copy-btn" id="copyHistoryBtn">Copy All</button>
    </div>
    <div class="panel-content" id="historyPanelContent"></div>
</div>

        <canvas id="myCanvas"></canvas>

        <div class="controls-container">
            <input type="text" id="myInput" placeholder="Type something here... Use Left/Right arrows to turn.">
            <button class="menu-btn" id="menuToggleBtn" title="Toggle Bird's Eye View">☰</button>
            <button class="menu-btn" id="stateToggleBtn" title="Toggle State Monitor">S</button>
            <button class="menu-btn" id="historyToggleBtn" title="Toggle History Tracker">H</button>
        </div>
    </div>

<script src="my-3d-maze-app-state.js"></script>
<script src="my-3d-maze-diagnostics.js"></script>
<script src="my-3d-maze-interface-helpers.js"></script>
<script src="maze-audio-controller.js"></script>
<script src="player-movement-controller.js"></script>
<script src="world-grid-view-functions.js"></script>
<script src="hallway-perspective-renderer.js"></script>
<script src="main.js"></script>
</body>
</html>
