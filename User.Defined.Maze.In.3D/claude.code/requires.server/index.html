<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ancient Hall</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

<div id="start-modal-overlay">
  <div id="start-modal-content">
    <h1>ANCIENT HALL</h1>
    <p>Procedural acoustic environment synthesis will instantiate upon entry. Use arrow keys to navigate.</p>
    <button id="start-game-btn"><b>Start Game</b></button>
  </div>
</div>

<div id="game-container">
  <div id="viewport-wrapper">
    <canvas id="hall"></canvas>
    
    <div id="mini-map-window">
      <canvas id="birdsEye"></canvas>
      <div id="mini-map-resize-handle"></div>
    </div>

    <div id="diagnostic-window">
      <div id="diagnostic-header-bar">
        <span id="diag-panel-title">SYSTEM MONITOR</span>
        <div id="diag-zoom-controls">
          <button id="diag-copy-btn" title="Copy All Content to Clipboard" style="margin-right: 8px;"><b>[Copy All]</b></button>
          <button id="diag-zoom-out-btn" title="Zoom Out Content"><b>(-)</b></button>
          <button id="diag-zoom-in-btn" title="Zoom In Content"><b>(+)</b></button>
        </div>
      </div>
      <div id="diag-content-wrapper">
        <div id="diag-content-scaler" style="--zoom-factor: 1.0;"></div>
      </div>
    </div>
  </div>
  
  <div id="bottom-bar">
    <button id="toggle-diag-s-btn" class="diag-btn"><b>S</b></button>
    <button id="toggle-diag-p-btn" class="diag-btn"><b>P</b></button>
    <button id="toggle-diag-b-btn" class="diag-btn"><b>B</b></button>
    <button id="toggle-diag-m-btn" class="diag-btn"><b>M</b></button>
    <button id="toggle-2d-btn"><b>2D</b></button>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
