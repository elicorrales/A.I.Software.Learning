<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hallway Canvas</title>
    <style>
        /* Remove default margins and prevent scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Set up a vertical flex container */
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* Canvas fills all available space and is white */
        canvas {
            flex-grow: 1;
            width: 100%;
            background-color: #ffffff; 
            display: block;
        }

        /* Input bar spans the full width */
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-top: 1px solid #ccc;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="myCanvas"></canvas>
        <input type="text" id="myInput" placeholder="Type something here...">
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        
        function drawHallway() {
            const w = canvas.width;
            const h = canvas.height;
            
            // Clear canvas to clean white
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            
            // Center point of perspective (vanishing point)
            const cx = w / 2;
            const cy = h / 2;
            
            // Size of the far end of the hallway (the back wall)
            const backW = w * 0.2;
            const backH = h * 0.2;
            
            // Coordinates of the back wall corners
            const x1 = cx - backW / 2;
            const x2 = cx + backW / 2;
            const y1 = cy - backH / 2;
            const y2 = cy + backH / 2;
            
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 2;
            
            // 1. Draw the 4 main perspective depth lines (corners of the hallway)
            ctx.beginPath();
            ctx.moveTo(0, 0);   ctx.lineTo(x1, y1); // Top-left
            ctx.moveTo(w, 0);   ctx.lineTo(x2, y1); // Top-right
            ctx.moveTo(0, h);   ctx.lineTo(x1, y2); // Bottom-left
            ctx.moveTo(w, h);   ctx.lineTo(x2, y2); // Bottom-right
            ctx.stroke();
            
            // 2. Draw the rectangle for the back wall
            ctx.strokeRect(x1, y1, backW, backH);
            
            // 3. Draw the panels/segments spaced far apart to create the 3D depth illusion
            // Using a geometric progression (0.1, 0.3, 0.6) to properly mimic 3D perspective spacing
            const depthFactors = [0.1, 0.3, 0.6]; 
            
            depthFactors.forEach(t => {
                // Interpolate positions between the outer screen edge and inner back wall
                const segX1 = x1 * t;
                const segX2 = w - (w - x2) * t;
                const segY1 = y1 * t;
                const segY2 = h - (h - y2) * t;
                
                ctx.beginPath();
                // Left vertical wall line
                ctx.moveTo(segX1, segY1);
                ctx.lineTo(segX1, segY2);
                
                // Right vertical wall line
                ctx.moveTo(segX2, segY1);
                ctx.lineTo(segX2, segY2);
                
                // Floor horizontal line connecting them
                ctx.lineTo(segX1, segY2);
                
                // Ceiling horizontal line connecting them
                ctx.moveTo(segX1, segY1);
                ctx.lineTo(segX2, segY1);
                
                ctx.stroke();
            });
        }

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            drawHallway();
        }

        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
