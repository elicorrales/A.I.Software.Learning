<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hallway Canvas</title>
    <style>
        /* Remove default margins and prevent scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Set up a vertical flex container */
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* Canvas fills all available space, is white, and allowed to shrink */
        canvas {
            flex-grow: 1;
            flex-shrink: 1;
            min-height: 0; /* CRITICAL: Allows flexbox to shrink canvas below its internal height */
            width: 100%;
            background-color: #ffffff; 
            display: block;
        }

        /* Input bar spans the full width, border removed to prevent window overflow */
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            border: none;
            outline: none;
            background-color: #f5f5f5; /* Slight tint so the input box is still visible against the white canvas */
            flex-shrink: 0; /* Prevents the input bar from getting squished */
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <canvas id="myCanvas"></canvas>
        <input type="text" id="myInput" placeholder="Type something here...">
    </div>

<script>
        const canvas = document.getElementById('myCanvas');
        const container = document.getElementById('mainContainer');
        const ctx = canvas.getContext('2d');
        
        // Track the continuous forward movement offset
        let forwardOffset = 0;
        const speed = 0.008; // Adjust this value to control how fast you move forward

        function drawHallway() {
            const w = canvas.width;
            const h = canvas.height;
            
            // Clear canvas to clean white
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            
            // Center point of perspective (vanishing point)
            const cx = w / 2;
            const cy = h / 2;
            
            // Size of the far end of the hallway (the back wall) - Small for a long hallway
            const backW = w * 0.05;
            const backH = h * 0.05;
            
            // Coordinates of the back wall corners
            const x1 = cx - backW / 2;
            const x2 = cx + backW / 2;
            const y1 = cy - backH / 2;
            const y2 = cy + backH / 2;
            
            // Fill Floor (Medium Gray)
            ctx.fillStyle = '#888888';
            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.lineTo(x1, y2);
            ctx.lineTo(x2, y2);
            ctx.lineTo(w, h);
            ctx.closePath();
            ctx.fill();

            // Fill Left Wall (Light Gray)
            ctx.fillStyle = '#e0e0e0';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(x1, y1);
            ctx.lineTo(x1, y2);
            ctx.lineTo(0, h);
            ctx.closePath();
            ctx.fill();

            // Fill Right Wall (Light Gray)
            ctx.fillStyle = '#e0e0e0';
            ctx.beginPath();
            ctx.moveTo(w, 0);
            ctx.lineTo(x2, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(w, h);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 2;
            
            // 1. Draw the 4 main perspective depth lines (corners of the hallway)
            ctx.beginPath();
            ctx.moveTo(0, 0);   ctx.lineTo(x1, y1); // Top-left
            ctx.moveTo(w, 0);   ctx.lineTo(x2, y1); // Top-right
            ctx.moveTo(0, h);   ctx.lineTo(x1, y2); // Bottom-left
            ctx.moveTo(w, h);   ctx.lineTo(x2, y2); // Bottom-right
            ctx.stroke();
            
            // 2. Draw the rectangle for the back wall
            ctx.strokeRect(x1, y1, backW, backH);
            
            // 3. Draw the panels/segments spaced far apart to create the 3D depth illusion
            // Base static distances that we will shift dynamically
            const baseDistances = [1.3, 2.0, 3.5, 7.0]; 
            
            baseDistances.forEach((baseZ, index) => {
                // Calculate dynamic depth by subtracting the offset. 
                // Using modulo math ensures segments wrap smoothly to the back when they pass the camera view.
                let z = baseZ - forwardOffset;
                const minZ = 0.5; // Limit how close a segment gets before resetting to the horizon
                const maxZ = 7.0;
                
                if (z < minZ) {
                    z += (maxZ - minZ);
                }

                const scale = 1 / z;
                
                const segX1 = cx - (cx * scale);
                const segX2 = cx + ((w - cx) * scale);
                const segY1 = cy - (cy * scale);
                const segY2 = cy + ((h - cy) * scale);
                
                ctx.beginPath();
                // Left vertical wall line
                ctx.moveTo(segX1, segY1);
                ctx.lineTo(segX1, segY2);
                
                // Right vertical wall line
                ctx.moveTo(segX2, segY1);
                ctx.lineTo(segX2, segY2);
                
                // Floor horizontal line connecting them
                ctx.lineTo(segX1, segY2);
                
                // Ceiling horizontal line connecting them
                ctx.moveTo(segX1, segY1);
                ctx.lineTo(segX2, segY1);
                
                ctx.stroke();

                // Draw a simple outline door to the right side of each left-wall vertical line
                if (index < baseDistances.length - 1) {
                    let nextZ = baseDistances[index + 1] - forwardOffset;
                    if (nextZ < minZ) nextZ += (maxZ - minZ);

                    const nextScale = 1 / nextZ;
                    const nextSegX1 = cx - (cx * nextScale);
                    const nextSegY1 = cy - (cy * nextScale);
                    const nextSegY2 = cy + ((h - cy) * nextScale);

                    // Interpolation ratio for the door width (0.4 means 40% of the way to next line)
                    const t = 0.4;
                    const doorWidthX = segX1 + (nextSegX1 - segX1) * t; 
                    
                    // Height calculations keeping tops below the ceiling
                    const wallHeight = segY2 - segY1;
                    const doorTopY1 = segY2 - (wallHeight * 0.75);
                    const doorTopY2 = nextSegY2 - ((nextSegY2 - nextSegY1) * 0.75);

                    // Find the exact floor intersection point at the door's width
                    const doorBottomY2 = segY2 + (nextSegY2 - segY2) * t;

                    // Only draw doors if perspective calculations flow front-to-back
                    if (segX1 < nextSegX1) {
                        ctx.beginPath();
                        ctx.moveTo(segX1, segY2);         // Door bottom left at wall vertical line
                        ctx.lineTo(segX1, doorTopY1);      // Up to door top left
                        ctx.lineTo(doorWidthX, doorTopY2);   // Across top matching perspective slant
                        ctx.lineTo(doorWidthX, doorBottomY2); // Down to meet the slanted floor line perfectly
                        ctx.stroke();
                    }
                }
            });
        }

        // Standard game animation frame loop to handle rendering continuously
        function animationLoop() {
            forwardOffset += speed;
            const maxCycleDistance = 7.0 - 0.5; // Resets the offset sequence cleanly to mirror the wrapping bounds
            if (forwardOffset >= maxCycleDistance) {
                forwardOffset -= maxCycleDistance;
            }
            
            drawHallway();
            requestAnimationFrame(animationLoop);
        }

        function resizeCanvas() {
            // Read layout sizing from the layout container to prevent internal resolution canvas loops
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight - document.getElementById('myInput').offsetHeight;
        }

        window.addEventListener('load', () => {
            resizeCanvas();
            animationLoop(); // Starts the continuous forward engine once assets render initially
        });
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
