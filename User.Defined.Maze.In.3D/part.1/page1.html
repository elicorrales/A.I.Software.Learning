<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas and Input Layout</title>
    <style>
        /* Remove default margins and prevent scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Set up a vertical flex container */
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* Canvas fills all available space */
        canvas {
            flex-grow: 1;
            width: 100%;
            background-color: #f0f0f0; /* Optional: background color so you can see it */
            display: block; /* Prevents tiny ghost margins at the bottom */
        }

        /* Input bar spans the full width */
        input[type="text"] {
            width: 100%;
            box-sizing: border-box; /* Ensures padding doesn't push it off screen */
            padding: 12px;
            font-size: 16px;
            border: none;
            border-top: 1px solid #ccc;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="myCanvas"></canvas>
        <input type="text" id="myInput" placeholder="Type something here...">
    </div>

    <script>
        // Optional: Handling canvas resolution on window resize
        const canvas = document.getElementById('myCanvas');
        
        function resizeCanvas() {
            // This matches the drawing resolution to the actual element size
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            
            // Example: Draw something to prove it works
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#3498db';
            ctx.fillRect(20, 20, canvas.width - 40, canvas.height - 40);
        }

        // Run on load and whenever the window changes size
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
