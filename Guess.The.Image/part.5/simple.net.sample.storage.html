<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Simple Image Classifier (Storage Mode)</title>
<style>
body {
  margin: 0;
  background: linear-gradient(180deg, #fff7cc, #ffe9a8);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column; /* keep column */
  height: 100vh;
}

.wrapper {
  display: flex;
  gap: 40px;
  align-items: center;
  padding: 30px 40px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

canvas {
  background: #ffffff;
  border: 2px solid #f2d27a;
  width: 280px;
  height: 280px;
  cursor: crosshair;
}

/* middle column */
.middle {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}

/* inputs */
.inputRow {
  display: flex;
  align-items: center;
  gap: 6px;
}

.inputRow label {
  font-size: 12px;
}

/* buttons */
.guess {
  padding: 10px 18px;
  cursor: pointer;
  background: #ffd54d;
  border: none;
  border-radius: 6px;
}

.undo, .reset-model, .reset-samples {
  padding: 10px 18px;
  cursor: pointer;
  background: #e0e0e0;
  border: none;
  border-radius: 6px;
  font-size: 13px;
}

.undo:hover, .reset-model:hover, .reset-samples:hover {
  background: #d4d4d4;
}

/* right panel */
.panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* vertical rows */
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.digit {
  width: 60px;
  height: 32px;
  background: #f5e6a3;
  border: none;
  font-size: 14px;
  cursor: pointer;
}

.value {
  width: 60px;
  font-size: 12px;
}

.page {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px; /* spacing between blocks */
}

.thumbWrapper {
  width: 100%;
  max-width: 900px;
  padding: 12px 20px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}
.thumbWrapper {
  margin-top: 20px;   /* ensures visible separation */
}

.thumbWrapper {
  margin-top: 20px;
  width: 100%;          /* fill same width as parent */
  max-width: 900px;
}

.wrapper {
  width: 100%;
  max-width: 900px;
}

/* Gives a subtle glow when you click the canvas, 
   letting you know CTRL+V will work */
canvas:focus {
  outline: none;
  box-shadow: 0 0 5px #4A90E2;
  border-color: #4A90E2;
}

.tools {
  padding-right: 10px;
}
.tool-btn, .adj-btn {
  padding: 8px;
  cursor: pointer;
  background: #fff;
  border: 1px solid #f2d27a;
  border-radius: 4px;
}
.tool-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.tool-group label {
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
}

</style>
</head>

<body>

<div class="page">

  <div class="wrapper">
  <div class="tools" style="display: flex; flex-direction: column; gap: 15px; align-items: center;">
      <button class="tool-btn" id="grayBtn" title="Grayscale">🌓</button>
    
      <div class="tool-group">
        <label>Contrast</label>
        <div class="inputRow">
          <button class="adj-btn" id="contrastUp">▲</button>
          <button class="adj-btn" id="contrastDn">▼</button>
        </div>
      </div>

      <div class="tool-group">
        <label>Brightness</label>
        <div class="inputRow">
          <button class="adj-btn" id="brightUp">▲</button>
          <button class="adj-btn" id="brightDn">▼</button>
        </div>
      </div>
    </div>

    <canvas id="canvas" width="280" height="280"></canvas>

    <div class="middle">
      <div style="font-size: 12px; text-align: left; margin-bottom: 10px;">
        <strong>Activation Mode:</strong><br>
        <input type="radio" name="mode" value="linear" checked> Linear (Raw)<br>
        <input type="radio" name="mode" value="sigmoid"> Sigmoid<br>
        <input type="radio" name="mode" value="softmax"> Softmax
      </div>
      <button class="guess" id="guessBtn">Guess</button>
      <button class="undo" id="undoBtn">Undo</button>

      <button class="reset-model" id="resetModelBtn">Rst Mdl</button>
      <button class="reset-samples" id="resetSampBtn">Rst Samp</button>

      <div class="inputRow">
        <label>Samples:</label>
        <span id="sampleCount">0</span>
      </div>

      <div class="inputRow">
        <label>Memory:</label>
        <span id="sampleMemory">0 KB</span>
      </div>
    </div>

    <div class="panel">
      <div class="row"><button class="digit" id="d0">house</button><span class="value" id="v0"></span></div>
      <div class="row"><button class="digit" id="d1">car</button><span class="value" id="v1"></span></div>
      <div class="row"><button class="digit" id="d2">tree</button><span class="value" id="v2"></span></div>
      <div class="row"><button class="digit" id="d3">dog</button><span class="value" id="v3"></span></div>
    </div>

  </div>

  <div class="wrapper" style="justify-content: space-around; padding: 20px 40px;">
    <div class="thumb-box" style="display: flex; flex-direction: column; align-items: center;">
      <button id="clearThumbsBtn" style="background: #ffffff; border: 2px solid #f2d27a; width: 60px; height: 60px; cursor: pointer; color: red; font-size: 30px; font-weight: bold; border-radius: 4px; display: flex; justify-content: center; align-items: center;">
        ✕
      </button>
      <div style="font-size: 11px; margin-top: 4px; font-weight: bold; color: #555;">clear</div>
    </div>
    <div class="thumb-box" style="display: flex; flex-direction: column; align-items: center;">
      <canvas id="thumb0" width="28" height="28" style="background: #ffffff; border: 2px solid #f2d27a; width: 56px; height: 56px;"></canvas>
      <div style="font-size: 11px; margin-top: 4px; font-weight: bold;">house</div>
    </div>
    <div class="thumb-box" style="display: flex; flex-direction: column; align-items: center;">
      <canvas id="thumb1" width="28" height="28" style="background: #ffffff; border: 2px solid #f2d27a; width: 56px; height: 56px;"></canvas>
      <div style="font-size: 11px; margin-top: 4px; font-weight: bold;">car</div>
    </div>
    <div class="thumb-box" style="display: flex; flex-direction: column; align-items: center;">
      <canvas id="thumb2" width="28" height="28" style="background: #ffffff; border: 2px solid #f2d27a; width: 56px; height: 56px;"></canvas>
      <div style="font-size: 11px; margin-top: 4px; font-weight: bold;">tree</div>
    </div>
    <div class="thumb-box" style="display: flex; flex-direction: column; align-items: center;">
      <canvas id="thumb3" width="28" height="28" style="background: #ffffff; border: 2px solid #f2d27a; width: 56px; height: 56px;"></canvas>
      <div style="font-size: 11px; margin-top: 4px; font-weight: bold;">dog</div>
    </div>
  </div>

</div>

<script src="simple.net.sample.storage.js"></script>
</body>
</html>
