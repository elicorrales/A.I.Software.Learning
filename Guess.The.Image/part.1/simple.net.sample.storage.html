<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Simple Image Classifier (Storage Mode)</title>
<style>
body {
  margin: 0;
  background: linear-gradient(180deg, #fff7cc, #ffe9a8);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.wrapper {
  display: flex;
  gap: 40px;
  align-items: center;
  padding: 30px 40px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

canvas {
  background: #ffffff;
  border: 2px solid #f2d27a;
  width: 280px;
  height: 280px;
  cursor: crosshair;
}

/* middle column */
.middle {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}

/* inputs */
.inputRow {
  display: flex;
  align-items: center;
  gap: 6px;
}

.inputRow label {
  font-size: 12px;
}

/* buttons */
.guess {
  padding: 10px 18px;
  cursor: pointer;
  background: #ffd54d;
  border: none;
  border-radius: 6px;
}

.undo {
  padding: 10px 18px;
  cursor: pointer;
  background: #e0e0e0;
  border: none;
  border-radius: 6px;
}

/* right panel */
.panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* vertical rows */
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.digit {
  width: 60px; /* Widened to fit words like "house" */
  height: 32px;
  background: #f5e6a3;
  border: none;
  font-size: 14px;
  cursor: pointer;
}

.value {
  width: 60px;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="wrapper">

  <canvas id="canvas" width="280" height="280"></canvas>

  <div class="middle">
    <div style="font-size: 12px; text-align: left; margin-bottom: 10px;">
      <strong>Activation Mode:</strong><br>
      <input type="radio" name="mode" value="linear" checked> Linear (Raw)<br>
      <input type="radio" name="mode" value="sigmoid"> Sigmoid<br>
      <input type="radio" name="mode" value="softmax"> Softmax
    </div>
    <button class="guess" id="guessBtn">Guess</button>
    <button class="undo" id="undoBtn">Undo</button>

    <div class="inputRow">
      <label>Samples:</label>
      <span id="sampleCount">0</span>
    </div>

    <div class="inputRow">
      <label>Memory:</label>
      <span id="sampleMemory">0 KB</span>
    </div>

  </div>

  <div class="panel">
    <div class="row"><button class="digit" id="d0">house</button><span class="value" id="v0"></span></div>
    <div class="row"><button class="digit" id="d1">car</button><span class="value" id="v1"></span></div>
    <div class="row"><button class="digit" id="d2">tree</button><span class="value" id="v2"></span></div>
    <div class="row"><button class="digit" id="d3">dog</button><span class="value" id="v3"></span></div>
  </div>

</div>

<script src="simple.net.sample.storage.js"></script>
</body>
</html>
