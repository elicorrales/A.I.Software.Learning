<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Diagnostics | Camera Probe</title>
    <link rel="stylesheet" href="webcam.css"> 
</head>
<body>

    <div class="container" id="diagnostic-view">
        <h1>Hardware Diagnostic Tool</h1>
        <button id="main-btn" onclick="checkCameras()">Detect Webcams</button>
        <div id="status-label">System idle. Ready to scan...</div>
    </div>

    <div class="container" id="dashboard-view" style="display:none;">
        <h1>Dashboard</h1>

        <video id="cam" autoplay playsinline style="display: none; background:#0b1220;"></video>

        <div class="dashboard-grid">
            
            <div class="left-column">
                <div class="media-box">
                    <canvas id="snapBackground"></canvas>
                    <div class="btn-split-row">
                        <button onclick="takeSnapshot('background')">Background</button>
                        <button class="btn-secondary" onclick="clearBackground()">Clear</button>
                    </div>
                </div>

                <div class="media-box" style="margin-top: 0.5rem;">
                    <div class="camera-overlay-box"></div>
                    <canvas id="bkg2VsSnapped"></canvas>
                    <div class="label">Natural Isolated Color Diff</div>
                </div>
            </div>

            <div class="middle-column">
                <div class="panel-section-title">System Metrics</div>
                <div class="panel-section-title">Hardware Status</div>
                <div class="pill-box">
                    <div id="stream-pill" class="diag-pill">Stream: Inactive</div>
                    <div id="fps-pill" class="diag-pill active">FPS: -- Hz</div>
                </div>

                <div class="panel-section-title">Signal Extraction</div>
                <div style="font-size: 0.95rem; font-weight: 700; color: #475569; margin: 0.5rem 0 0.75rem 0; text-align: left; padding-left: 0.25rem;"> Samples: <span id="samples-counter-pill" style="color: var(--accent); font-weight: 800;">0</span>
                </div>
    <div class="panel-section-title">Model Mode Configuration</div>
    <div class="model-mode-container">
        <label class="radio-inline">
            <input type="radio" name="modelMode" value="linear" checked> Linear
        </label>
        <label class="radio-inline">
            <input type="radio" name="modelMode" value="sigmoid"> Sigmoid
        </label>
        <label class="radio-inline">
            <input type="radio" name="modelMode" value="softmax"> Softmax
        </label>
    </div>
    <div class="panel-section-title">Inference Engine</div>
    <div class="predict-container">
        <button id="predict-toggle-btn" class="predict-btn">Stream Predictions: OFF</button>
    </div>
            </div>

            <div class="right-column">
                <div class="panel-section-title" style="border-bottom-color: #cbd5e1; text-align: center;">Train Labels</div>
                <button class="train-btn" id="btn1" data-phrase="razor.">-- razor</button>
                <button class="train-btn" id="btn2" data-phrase="pen.">-- pen</button>
                <button class="train-btn" id="btn3" data-phrase="eyedrops.">-- eye drops</button>
                <button class="train-btn" id="btn4" data-phrase="scissors.">-- scissors</button>
                <button class="train-btn" id="btn5" data-phrase="tictacs.">-- tic tacs</button>
                <button class="train-btn" id="btn6" data-phrase="spoon.">-- spoon</button>
                <button class="train-btn" id="btn7" data-phrase="background.">-- background</button>
            </div>

        </div>
    </div>

    <script src="neural.network.model.js"></script>
    <script src="webcam.js"></script>
</body>
</html>
