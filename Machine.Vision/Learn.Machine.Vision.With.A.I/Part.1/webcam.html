<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Diagnostics | Camera Probe</title>
    <style>
        :root {
            --bg-color: #1e293b;
            --card-bg: #ffffff;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0 2rem;
        }

        .container {
            background: var(--card-bg);
            color: #1e293b;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: min(98vw, 1500px);
            max-width: none;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: var(--bg-color);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 1rem;
            margin-top: 0;
        }

        #status-label {
            display: block;
            margin-top: 1rem;
            padding: 1rem;
            background: #f1f5f9;
            border-radius: 4px;
            font-family: 'Cascadia Code', 'Courier New', monospace;
            font-size: 1.5rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
            min-height: 50px;
        }

        .error-text { color: var(--error); font-weight: bold; }
        .success-text { color: var(--success); font-weight: bold; }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.3rem;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .label {
            margin-top: 0.5rem;
            font-weight: 600;
            font-size: 1.2rem;
            color: #1e293b;
        }

        /* Dashboard Grid Layout System */
        .dashboard-grid {
            display: flex;
            gap: 2rem;
            justify-content: space-between;
            align-items: stretch;
            margin-top: 1rem;
            width: 100%;
        }

        /* Left Column: Vertically stacked visual canvases */
        .left-column {
            flex: 0 0 400px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .media-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .media-box canvas {
            width: 100%;
            height: auto;
            border-radius: 6px;
            background: #2b2f3a;
        }

        /* Middle Column: Control Panels and Diagnostics Status */
        .middle-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: left;
        }

        .panel-section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.25rem;
        }

        .pill-box {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .diag-pill {
            background: #e2e8f0;
            color: #475569;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: monospace;
        }

        .diag-pill.active {
            background: #dcfce7;
            color: #15803d;
        }

        .control-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .btn-secondary {
            background-color: #64748b;
        }

        /* Right Column: Training/Label Buttons Panel */
        .right-column {
            flex: 0 0 280px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            background: #f1f5f9;
            border-radius: 8px;
            padding: 1.5rem;
        }

        .label-btn {
            width: 100%;
            background-color: #1e293b;
            color: #f8fafc;
            padding: 1rem;
            font-size: 1.2rem;
            border-radius: 6px;
            text-transform: capitalize;
            border-left: 5px solid var(--accent);
        }

        .label-btn:hover {
            background-color: #334155;
        }

        video {
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container" id="diagnostic-view">
        <h1>Hardware Diagnostic Tool</h1>
        <button id="main-btn" onclick="checkCameras()">Detect Webcams</button>
        <div id="status-label">System idle. Ready to scan...</div>
    </div>

    <div class="container" id="dashboard-view" style="display:none;">
        <h1>Dashboard</h1>

        <video id="cam" autoplay playsinline style="display: none; background:#0b1220;"></video>

        <div class="dashboard-grid">
            
            <div class="left-column">
                <div class="media-box">
                    <canvas id="snapBackground"></canvas>
                    <button style="margin-top:0.5rem; width: 100%;" onclick="takeSnapshot('background')">
                        Capture Background
                    </button>
                </div>

                <div class="media-box">
                    <canvas id="bkg2VsSnapped"></canvas>
                    <div class="label">Natural Isolated Color Diff</div>
                </div>
            </div>

            <div class="middle-column">
                <div class="panel-section-title">System Metrics</div>
                <div class="pill-box">
                    <div class="diag-pill active">Stream: Active</div>
                    <div class="diag-pill">Matrix: Sync Ready</div>
                    <div class="diag-pill">Buffer: Direct</div>
                    <div class="diag-pill">FPS: 60hz</div>
                </div>

                <div class="panel-section-title">Hardware Overrides</div>
                <div class="control-group">
                    <button class="btn-secondary" onclick="console.log('Fake Action: Calibration Triggered')">Calibrate Sensors</button>
                    <button class="btn-secondary" onclick="console.log('Fake Action: Zero Gains')">Reset Gains</button>
                </div>

                <div class="panel-section-title">Signal Extraction</div>
                <div class="pill-box">
                    <div class="diag-pill">Threshold Trigger: Off</div>
                    <div class="diag-pill">Delta Weight: 0.00%</div>
                </div>
            </div>

            <div class="right-column">
                <div class="panel-section-title" style="border-bottom-color: #cbd5e1; text-align: center;">Train Labels</div>
                <button class="label-btn" onclick="handleLabelClick('razor')">-- razor</button>
                <button class="label-btn" onclick="handleLabelClick('pen')">-- pen</button>
                <button class="label-btn" onclick="handleLabelClick('eye drops')">-- eye drops</button>
                <button class="label-btn" onclick="handleLabelClick('scissors')">-- scissors</button>
                <button class="label-btn" onclick="handleLabelClick('tic tacs')">-- tic tacs</button>
            </div>

        </div>
    </div>

    <script>
        let activeStream = null;
        let backgroundPixels = null;
        const compareCanvas = document.createElement('canvas');
        const compareCtx = compareCanvas.getContext('2d');
        let liveCompareRunning = false;

        function handleLabelClick(labelName) {
            console.log(`Training Event Logged: Classification labeled as [${labelName}]`);
        }

        function takeSnapshot(which) {
          const canvas = document.getElementById('snapBackground');
          const video = document.getElementById('cam');
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          backgroundPixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }

        function renderColorDiff(diffCtx, currentPixels, backgroundPixels, width, height, threshold = 40) {
            const out = diffCtx.createImageData(width, height);

            const a = currentPixels.data;
            const b = backgroundPixels.data;
            const d = out.data;

            for (let i = 0; i < a.length; i += 4) {
                const rDiff = Math.abs(a[i] - b[i]);
                const gDiff = Math.abs(a[i + 1] - b[i + 1]);
                const bDiff = Math.abs(a[i + 2] - b[i + 2]);

                const diff = (rDiff + gDiff + bDiff) > threshold;

                if (diff) {
                    d[i] = a[i];
                    d[i + 1] = a[i + 1];
                    d[i + 2] = a[i + 2];
                    d[i + 3] = 255;
                } else {
                    d[i] = 255;
                    d[i + 1] = 255;
                    d[i + 2] = 255;
                    d[i + 3] = 255;
                }
            }

            diffCtx.putImageData(out, 0, 0);
        }

        function startLiveCompare() {
          if (liveCompareRunning) return;
          liveCompareRunning = true;

          const video = document.getElementById('cam');
          const diff2Canvas = document.getElementById('bkg2VsSnapped');
          const diff2Ctx = diff2Canvas.getContext('2d');

          function loop() {
            if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) {
              if (compareCanvas.width !== video.videoWidth || compareCanvas.height !== video.videoHeight) {
                compareCanvas.width = video.videoWidth;
                compareCanvas.height = video.videoHeight;
              }

              compareCtx.drawImage(video, 0, 0, compareCanvas.width, compareCanvas.height);
              const currentPixels = compareCtx.getImageData(0, 0, compareCanvas.width, compareCanvas.height);

              if (backgroundPixels && backgroundPixels.data.length === currentPixels.data.length) {
                renderColorDiff(
                  diff2Ctx,
                  currentPixels,
                  backgroundPixels,
                  compareCanvas.width,
                  compareCanvas.height,
                  40
                );
              }
            }
            requestAnimationFrame(loop);
          }
          requestAnimationFrame(loop);
        }

        async function startDashboardCamera() {
          const video = document.getElementById('cam');
          if (!activeStream) {
            activeStream = await navigator.mediaDevices.getUserMedia({ video: true });
          }
          video.srcObject = activeStream;
          video.onloadedmetadata = () => {
            video.play();
            requestAnimationFrame(() => {
              const w = video.videoWidth;
              const h = video.videoHeight;
              video.width = w;
              video.height = h;

              document.getElementById('snapBackground').width = w;
              document.getElementById('snapBackground').height = h;
              document.getElementById('bkg2VsSnapped').width = w;
              document.getElementById('bkg2VsSnapped').height = h;

              compareCanvas.width = w;
              compareCanvas.height = h;
            });
          };
        }

        async function checkCameras() {
            const statusLabel = document.getElementById('status-label');
            const mainBtn = document.getElementById('main-btn');

            mainBtn.disabled = true;
            statusLabel.innerHTML = "Requesting camera access...";

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                statusLabel.innerHTML = "<span class='error-text'>Error:</span> Media access not supported.";
                mainBtn.disabled = false;
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                activeStream = stream;

                statusLabel.innerHTML = "<span class='success-text'>Access Granted:</span> Camera hardware is active and recognized.";

                mainBtn.innerText = "Go To Dashboard";
                mainBtn.onclick = goToDashboard;

            } catch (err) {
                statusLabel.innerHTML = `<span class='error-text'>Error:</span> ${err.message}`;
            } finally {
                mainBtn.disabled = false;
            }
        }

        function goToDashboard() {
          document.getElementById('diagnostic-view').style.display = 'none';
          document.getElementById('dashboard-view').style.display = 'block';
          startDashboardCamera();
          startLiveCompare();
          requestAnimationFrame(() => {
            requestAnimationFrame(resizeCanvases);
          });
        }

        function resizeCanvases() {
          const canvas2 = document.getElementById('snapBackground');
          const canvas4 = document.getElementById('bkg2VsSnapped');

          canvas2.style.background = "#2b2f3a";
          canvas4.style.background = "#2b2f3a";
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const statusLabel = document.getElementById('status-label');
            const mainBtn = document.getElementById('main-btn');

            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');

                if (videoDevices.length === 0) {
                    statusLabel.innerHTML = "No camera hardware detected.";
                } else if (videoDevices.every(d => d.label === "")) {
                    statusLabel.innerHTML = `System ready. ${videoDevices.length} camera(s) detected. Click above to enable access.`;
                    mainBtn.innerText = "Unlock Cameras";
                } else {
                    statusLabel.innerHTML = `${videoDevices.length} camera(s) authorized and ready for use.`;
                }
            } catch (err) {
                statusLabel.innerHTML = "System standby.";
            }

            requestAnimationFrame(() => {
              requestAnimationFrame(resizeCanvases);
            });

            window.addEventListener('resize', resizeCanvases);
        });
    </script>
</body>
</html>
