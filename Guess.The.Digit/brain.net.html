<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Simple Digit Recognizer</title>
<style>
body {
  margin: 0;
  background: linear-gradient(180deg, #fff7cc, #ffe9a8);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.wrapper {
  display: flex;
  gap: 40px;
  align-items: center;

  background: #fff3c4;
  padding: 30px 40px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

canvas {
  background: #ffffff; /* Changed from #fffdf5 */
  border: 2px solid #f2d27a;
  width: 280px;
  height: 280px;
  cursor: crosshair; /* Optional: makes it feel more like a drawing tool */
}

/* middle column */
.middle {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}

/* inputs */
.inputRow {
  display: flex;
  align-items: center;
  gap: 6px;
}

.inputRow label {
  font-size: 12px;
}

.inputRow input {
  width: 50px;
}

/* guess button */
.guess {
  padding: 10px 18px;
  cursor: pointer;
  background: #ffd54d;
  border: none;
  border-radius: 6px;
}

/* right panel */
.panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* vertical rows */
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.digit {
  width: 40px;
  height: 32px;
  background: #f5e6a3;
  border: none;
  font-size: 14px;
  cursor: pointer;
}

.value {
  width: 60px;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="wrapper">

  <canvas id="canvas" width="280" height="280"></canvas>

  <div class="middle">

    <div class="inputRow">
      <label for="layers">Layers</label>
      <input id="layers" type="number" min="0" value="2">
    </div>

    <div class="inputRow">
      <label for="perceptrons">Per Layer</label>
      <input id="perceptrons" type="number" min="1" value="32">
    </div>

    <div class="inputRow">
      <label for="iterations">Iterations</label>
      <input id="iterations" type="number" min="1" value="5">
    </div>

    <button class="guess" id="guessBtn">Guess</button>
  </div>

  <div class="panel">

    <div class="row"><button class="digit" id="d0">0</button><span class="value" id="v0"></span></div>
    <div class="row"><button class="digit" id="d1">1</button><span class="value" id="v1"></span></div>
    <div class="row"><button class="digit" id="d2">2</button><span class="value" id="v2"></span></div>
    <div class="row"><button class="digit" id="d3">3</button><span class="value" id="v3"></span></div>
    <div class="row"><button class="digit" id="d4">4</button><span class="value" id="v4"></span></div>
    <div class="row"><button class="digit" id="d5">5</button><span class="value" id="v5"></span></div>
    <div class="row"><button class="digit" id="d6">6</button><span class="value" id="v6"></span></div>
    <div class="row"><button class="digit" id="d7">7</button><span class="value" id="v7"></span></div>
    <div class="row"><button class="digit" id="d8">8</button><span class="value" id="v8"></span></div>
    <div class="row"><button class="digit" id="d9">9</button><span class="value" id="v9"></span></div>

  </div>

</div>

<script src="brain.js"></script>
<script src="brain.net.js"></script>
</body>
</html>
