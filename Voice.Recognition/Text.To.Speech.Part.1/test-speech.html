<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Grid Test</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f9;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        #controls {
            text-align: center;
            margin-bottom: 20px;
        }

        #controls button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #444;
            color: white;
            cursor: pointer;
        }

        #voiceGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .voice-card {
            position: relative;
            background: white;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            background: #d9534f;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #b52b27;
        }

        .voice-name {
            font-size: 1.1rem;
            font-weight: bold;
            padding-right: 40px;
        }

        .voice-info {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .speak-btn {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        .speak-btn:hover {
            background: #0056b3;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            color: #444;
        }
    </style>
</head>
<body>

    <h1>Available Voices</h1>

    <div id="controls">
        <button id="resetBtn">Restore Hidden Voices</button>
    </div>

    <div id="voiceGrid"></div>

    <div id="status">Loading voices...</div>

    <script>
        const synth = window.speechSynthesis;
        const voiceGrid = document.getElementById("voiceGrid");
        const status = document.getElementById("status");
        const resetBtn = document.getElementById("resetBtn");

        const STORAGE_KEY = "hiddenVoices";

        function getHiddenVoices() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        }

        function saveHiddenVoices(hidden) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(hidden));
        }

        function hideVoice(voiceName) {
            const hidden = getHiddenVoices();

            if (!hidden.includes(voiceName)) {
                hidden.push(voiceName);
                saveHiddenVoices(hidden);
            }

            renderVoices();
        }

        function speakVoice(voice) {
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(
                "This is a test"
            );

            utterance.voice = voice;
            //utterance.lang = voice.lang;

            utterance.onstart = () => {
                status.innerText = `Speaking: ${voice.name}`;
            };

            utterance.onend = () => {
                status.innerText = `Finished: ${voice.name}`;
            };

            synth.speak(utterance);
        }

        function renderVoices() {
            const voices = synth.getVoices();
            const hiddenVoices = getHiddenVoices();

            voiceGrid.innerHTML = "";

const visibleVoices = voices.filter((voice) => {
    const name = voice.name.toLowerCase();

    const isEnglish =
        voice.lang.toLowerCase().startsWith("en");

    const unwanted =
        name.includes("female") ||
        name.includes("robot")  ||
        name.includes("robosoft") ||
        name.includes("whisper") ||
                name.includes("caribbean");
    return (
        isEnglish &&
        !unwanted &&
        !hiddenVoices.includes(voice.name)
    );
});

            if (!visibleVoices.length) {
                status.innerText = "No visible voices.";
                return;
            }

            visibleVoices.forEach((voice) => {
                const card = document.createElement("div");
                card.className = "voice-card";

                const removeBtn = document.createElement("button");
                removeBtn.className = "remove-btn";
                removeBtn.textContent = "×";

                removeBtn.addEventListener("click", () => {
                    hideVoice(voice.name);
                });

                const name = document.createElement("div");
                name.className = "voice-name";
                name.textContent = voice.name;

                const info = document.createElement("div");
                info.className = "voice-info";

                info.innerHTML = `
                    <strong>Language:</strong> ${voice.lang}<br>
                    <strong>Default:</strong> ${voice.default ? "Yes" : "No"}<br>
                    <strong>Local Service:</strong> ${voice.localService ? "Yes" : "No"}
                `;

                const button = document.createElement("button");
                button.className = "speak-btn";
                button.textContent = "Speak";

                button.addEventListener("click", () => {
                    speakVoice(voice);
                });

                card.appendChild(removeBtn);
                card.appendChild(name);
                card.appendChild(info);
                card.appendChild(button);

                voiceGrid.appendChild(card);
            });

            status.innerText =
                `${visibleVoices.length} visible voices (${voices.length} total).`;
        }

        resetBtn.addEventListener("click", () => {
            localStorage.removeItem(STORAGE_KEY);
            renderVoices();
        });

        speechSynthesis.onvoiceschanged = renderVoices;

        renderVoices();
    </script>

</body>
</html>
