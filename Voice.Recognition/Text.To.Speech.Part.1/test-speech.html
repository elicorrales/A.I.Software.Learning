<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Grid Test</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f9;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        #voiceGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .voice-card {
            background: white;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .voice-name {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .voice-info {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .voice-card button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        .voice-card button:hover {
            background: #0056b3;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            color: #444;
        }
    </style>
</head>
<body>

    <h1>Available Voices</h1>

    <div id="voiceGrid"></div>

    <div id="status">Loading voices...</div>

    <script>
        const synth = window.speechSynthesis;
        const voiceGrid = document.getElementById("voiceGrid");
        const status = document.getElementById("status");

        function speakVoice(voice) {
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(
                "This is a test"
            );

            utterance.voice = voice;
            utterance.lang = "en-US";

            utterance.onstart = () => {
                status.innerText = `Speaking: ${voice.name}`;
            };

            utterance.onend = () => {
                status.innerText = `Finished: ${voice.name}`;
            };

            synth.speak(utterance);
        }

        function renderVoices() {
            const voices = synth.getVoices();

            voiceGrid.innerHTML = "";

            if (!voices.length) {
                status.innerText = "No voices available.";
                return;
            }

            voices.forEach((voice) => {
                const card = document.createElement("div");
                card.className = "voice-card";

                const name = document.createElement("div");
                name.className = "voice-name";
                name.textContent = voice.name;

                const info = document.createElement("div");
                info.className = "voice-info";

                info.innerHTML = `
                    <strong>Language:</strong> ${voice.lang}<br>
                    <strong>Default:</strong> ${voice.default ? "Yes" : "No"}<br>
                    <strong>Local Service:</strong> ${voice.localService ? "Yes" : "No"}
                `;

                const button = document.createElement("button");
                button.textContent = "Speak";
                button.addEventListener("click", () => speakVoice(voice));

                card.appendChild(name);
                card.appendChild(info);
                card.appendChild(button);

                voiceGrid.appendChild(card);
            });

            status.innerText = `${voices.length} voices loaded.`;
        }

        // Some browsers load voices async
        speechSynthesis.onvoiceschanged = renderVoices;

        // Initial attempt
        renderVoices();
    </script>

</body>
</html>
