<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Speech Input</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        font-family: Arial, sans-serif;
        color: white;
    }

    .container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
    }

    #textInput {
        width: 700px;
        max-width: 90vw;
        padding: 18px 22px;
        font-size: 24px;
        border: 2px solid #444;
        border-radius: 10px;
        outline: none;
        background: #222;
        color: white;
    }

    #textInput:focus,
    .settingInput:focus {
        border-color: #888;
    }

    .settingsRow {
        display: flex;
        gap: 12px;
    }

    .settingGroup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
    }

    .settingLabel {
        font-size: 14px;
        color: #bbb;
    }

    .settingInput {
        width: 120px;
        padding: 10px;
        font-size: 18px;
        border: 2px solid #444;
        border-radius: 8px;
        outline: none;
        background: #222;
        color: white;
        text-align: center;
    }
</style>
</head>

<body>

<div class="container">

    <input
        id="textInput"
        type="text"
        placeholder="Type something and press Enter"
    />

    <div class="settingsRow">

        <div class="settingGroup">
            <label class="settingLabel" for="rateInput">Rate</label>
            <input
                id="rateInput"
                class="settingInput"
                type="number"
                step="0.05"
                value="0.85"
                placeholder="Rate"
            />
        </div>

        <div class="settingGroup">
            <label class="settingLabel" for="pitchInput">Pitch</label>
            <input
                id="pitchInput"
                class="settingInput"
                type="number"
                step="0.05"
                value="1.0"
                placeholder="Pitch"
            />
        </div>

        <div class="settingGroup">
            <label class="settingLabel" for="volumeInput">Volume</label>
            <input
                id="volumeInput"
                class="settingInput"
                type="number"
                step="0.05"
                value="1.0"
                placeholder="Volume"
                min="0"
                max="1"
            />
        </div>

    </div>

</div>

<script src="./text-to-speech.js"></script>

<script>
    const input = document.getElementById("textInput");

    const rateInput = document.getElementById("rateInput");
    const pitchInput = document.getElementById("pitchInput");
    const volumeInput = document.getElementById("volumeInput");

    input.addEventListener("keydown", (event) => {

        if (event.key === "Enter") {

            const text = input.value.trim();

            if (text.length > 0) {

                speak(
                    text,
                    parseFloat(rateInput.value),
                    parseFloat(pitchInput.value),
                    parseFloat(volumeInput.value)
                );
            }

            // keep focus on input
            input.focus();
        }
    });

    // focus input on page load
    input.focus();
</script>

</body>
</html>
