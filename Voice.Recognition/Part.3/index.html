<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Microphone Meter</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
            linear-gradient(135deg, #0f172a 0%, #111827 30%, #1e3a8a 70%, #0f766e 100%);
        overflow: hidden;
        color: white;
    }

    .panel {
        width: 320px;
        padding: 30px;
        border-radius: 24px;
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow:
            0 0 30px rgba(0,0,0,0.4),
            0 0 80px rgba(59,130,246,0.15);
        text-align: center;
    }

    h1 {
        margin-top: 0;
        font-size: 26px;
        letter-spacing: 1px;
    }

    .status {
        margin-bottom: 24px;
        font-size: 14px;
        color: #cbd5e1;
    }

    .meter-wrap {
        width: 90px;
        height: 360px;
        margin: auto;
        padding: 10px;
        border-radius: 40px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        position: relative;
        overflow: hidden;
    }

    .meter {
        position: absolute;
        bottom: 10px;
        left: 10px;
        width: calc(100% - 20px);
        height: 0%;
        border-radius: 30px;
        background:
            linear-gradient(
                to top,
                #22c55e 0%,
                #eab308 60%,
                #ef4444 100%
            );

        /* removed transition */

        box-shadow:
            0 0 20px rgba(255,255,255,0.2),
            0 0 30px rgba(34,197,94,0.3);
    }

    .label {
        margin-top: 18px;
        font-size: 18px;
        font-weight: bold;
        color: #f8fafc;
    }

    audio {
        display: none;
    }
</style>
</head>

<body>

<div class="panel">
    <h1>MIC INPUT</h1>

    <div class="status" id="status">
        Requesting microphone access...
    </div>

    <div class="meter-wrap">
        <div class="meter" id="meter"></div>
    </div>

    <div class="label" id="percent">0%</div>
</div>

<audio id="audio" autoplay muted></audio>

<script>

//-------------------------------
// constants, globals, file scope
//-------------------------------

const meter = document.getElementById("meter");

const percent = document.getElementById("percent");

const statusText = document.getElementById("status");

const audio = document.getElementById("audio");

let analyser;

let dataArray;


//-------------------------------
// function definitions
//-------------------------------

function updateMeter() {

    analyser.getByteFrequencyData(dataArray);

    let sum = 0;

    for (let i = 0; i < dataArray.length; i++) {

        sum += dataArray[i];
    }

    const peak = Math.max(...dataArray);

    const volume = Math.min(
        100,
        Math.round((peak / 255) * 100)
    );

    meter.style.height = volume + "%";

    percent.textContent = volume + "%";

    requestAnimationFrame(updateMeter);
}


async function startMic() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        statusText.textContent =
            "Microphone connected";

        audio.srcObject = stream;

        const audioContext = new AudioContext();

        const source =
            audioContext.createMediaStreamSource(stream);

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 256;

        source.connect(analyser);

        dataArray =
            new Uint8Array(analyser.frequencyBinCount);

        updateMeter();

    }
    catch (err) {

        statusText.textContent =
            "Microphone access denied";

        console.error(err);
    }
}


//-------------------------------
// event handlers
//-------------------------------



//-------------------------------
// execute now
//-------------------------------

startMic();

</script>

</body>
</html>
