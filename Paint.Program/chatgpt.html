<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Paint Program</title>

<style>
    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
    }

    body{
        overflow:hidden;
        font-family:Arial, sans-serif;
        background:#d8d8d8;
    }

    #app{
        display:flex;
        width:100vw;
        height:100vh;
    }

    /* LEFT TOOLBAR */
    #toolbar{
        width:72px;
        background:#bcbcbc;
        border-right:2px solid #666;
        display:flex;
        flex-direction:column;
        align-items:center;
        padding-top:8px;
        gap:8px;
    }

    .tool{
        width:52px;
        height:52px;
        border:2px solid #444;
        background:#efefef;
        cursor:pointer;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:24px;
        user-select:none;
    }

    .tool.active{
        background:#8fc4ff;
        border-color:#0066cc;
    }

    /* MAIN */
    #main{
        flex:1;
        display:flex;
        flex-direction:column;
        background:#999;
    }

    #canvasWrap{
        flex:1;
        position:relative;
        background:#fff;
    }

    canvas{
        display:block;
        background:white;
        cursor:crosshair;
    }

    /* PALETTE */
    #palette{
        height:74px;
        background:#cfcfcf;
        border-top:2px solid #666;
        display:flex;
        flex-direction:column;
        justify-content:center;
        padding:6px;
        gap:4px;
    }

    .paletteRow{
        display:flex;
        gap:4px;
        justify-content:center;
    }

    .color{
        width:28px;
        height:28px;
        border:2px solid #444;
        cursor:pointer;
    }

    .color.active{
        border:4px solid #fff;
        outline:2px solid #000;
    }
</style>
</head>

<body>

<div id="app">

    <!-- TOOLBAR -->
    <div id="toolbar">
        <div class="tool" data-tool="circle">◯</div>
        <div class="tool" data-tool="rect">▭</div>
        <div class="tool" data-tool="line">／</div>
        <div class="tool" data-tool="pen">✎</div>
        <div class="tool" data-tool="brush">🖌</div>
        <div class="tool" data-tool="fill">🪣</div>
    </div>

    <!-- MAIN -->
    <div id="main">

        <div id="canvasWrap">
            <canvas id="paint"></canvas>
        </div>

        <!-- PALETTE -->
        <div id="palette">

            <div class="paletteRow" id="row1"></div>
            <div class="paletteRow" id="row2"></div>

        </div>

    </div>

</div>

<script>

const canvas = document.getElementById("paint");
const ctx = canvas.getContext("2d");

const wrap = document.getElementById("canvasWrap");

function resizeCanvas(){
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;

    ctx.fillStyle = "white";
    ctx.fillRect(0,0,canvas.width,canvas.height);
}
resizeCanvas();

window.addEventListener("resize", resizeCanvas);

/* =========================
   COLORS
========================= */

const colors = [
    "#000000","#444","#888","#ccc","#ffffff",
    "#ff0000","#ff8800","#ffff00","#00cc00","#00ffff",
    "#0000ff","#8000ff","#ff00ff","#ff9999","#884400",
    "#663300","#006600","#004488","#9999ff","#ff66cc"
];

let currentColor = "#000000";

const row1 = document.getElementById("row1");
const row2 = document.getElementById("row2");

colors.forEach((c,i)=>{
    const div = document.createElement("div");
    div.className = "color";
    div.style.background = c;

    if(i===0) div.classList.add("active");

    div.onclick = ()=>{
        document.querySelectorAll(".color")
            .forEach(x=>x.classList.remove("active"));

        div.classList.add("active");
        currentColor = c;
    };

    if(i < 10) row1.appendChild(div);
    else row2.appendChild(div);
});

/* =========================
   TOOLS
========================= */

let currentTool = null;

document.querySelectorAll(".tool").forEach(btn=>{

    btn.onclick = ()=>{

        if(currentTool === btn.dataset.tool){
            currentTool = null;
            btn.classList.remove("active");
            return;
        }

        document.querySelectorAll(".tool")
            .forEach(t=>t.classList.remove("active"));

        btn.classList.add("active");
        currentTool = btn.dataset.tool;
    };
});

/* =========================
   DRAWING
========================= */

let drawing = false;
let startX = 0;
let startY = 0;

let snapshot = null;

function getMouse(e){
    const r = canvas.getBoundingClientRect();

    return {
        x: Math.floor(e.clientX - r.left),
        y: Math.floor(e.clientY - r.top)
    };
}

canvas.addEventListener("mousedown", e=>{

    if(!currentTool) return;

    const m = getMouse(e);

    startX = m.x;
    startY = m.y;

    if(currentTool === "fill"){
        floodFill(m.x,m.y,currentColor);
        return;
    }

    drawing = true;

    snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);

    if(currentTool === "pen"){
        ctx.beginPath();
        ctx.moveTo(m.x,m.y);
    }
});

canvas.addEventListener("mousemove", e=>{

    if(!drawing) return;

    const m = getMouse(e);

    ctx.putImageData(snapshot,0,0);

    ctx.strokeStyle = currentColor;
    ctx.fillStyle = currentColor;
    ctx.lineWidth = 2;

    switch(currentTool){

        case "line":
            ctx.beginPath();
            ctx.moveTo(startX,startY);
            ctx.lineTo(m.x,m.y);
            ctx.stroke();
            break;

        case "rect":
            ctx.strokeRect(
                startX,
                startY,
                m.x-startX,
                m.y-startY
            );
            break;

        case "circle":

            const radius = Math.hypot(
                m.x-startX,
                m.y-startY
            );

            ctx.beginPath();
            ctx.arc(startX,startY,radius,0,Math.PI*2);
            ctx.stroke();
            break;

        case "pen":

            ctx.putImageData(snapshot,0,0);

            snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);

            ctx.beginPath();
            ctx.moveTo(startX,startY);
            ctx.lineTo(m.x,m.y);
            ctx.stroke();

            startX = m.x;
            startY = m.y;

            break;

        case "brush":

            ctx.putImageData(snapshot,0,0);

            snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);

            drawBrush(m.x,m.y);

            startX = m.x;
            startY = m.y;

            break;
    }
});

canvas.addEventListener("mouseup", ()=>{
    drawing = false;
});

canvas.addEventListener("mouseleave", ()=>{
    drawing = false;
});

/* =========================
   BRUSH
========================= */

function drawBrush(x,y){

    ctx.fillStyle = currentColor;

    for(let i=0;i<18;i++){

        const ox = (Math.random()-0.5)*18;
        const oy = (Math.random()-0.5)*18;
        const size = Math.random()*8+2;

        ctx.beginPath();
        ctx.ellipse(
            x+ox,
            y+oy,
            size,
            size*0.6,
            Math.random()*Math.PI,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

/* =========================
   FLOOD FILL
========================= */

function floodFill(x,y,fillColor){

    const img = ctx.getImageData(
        0,0,canvas.width,canvas.height
    );

    const data = img.data;

    const target = getPixel(data,x,y);

    const fill = hexToRgb(fillColor);

    if(equalColor(target,fill)) return;

    const stack = [[x,y]];

    while(stack.length){

        const [cx,cy] = stack.pop();

        if(cx<0 || cy<0 ||
           cx>=canvas.width ||
           cy>=canvas.height) continue;

        const cur = getPixel(data,cx,cy);

        if(!equalColor(cur,target)) continue;

        setPixel(data,cx,cy,fill);

        stack.push([cx+1,cy]);
        stack.push([cx-1,cy]);
        stack.push([cx,cy+1]);
        stack.push([cx,cy-1]);
    }

    ctx.putImageData(img,0,0);
}

function getPixel(data,x,y){

    const i = (y*canvas.width + x)*4;

    return {
        r:data[i],
        g:data[i+1],
        b:data[i+2],
        a:data[i+3]
    };
}

function setPixel(data,x,y,c){

    const i = (y*canvas.width + x)*4;

    data[i]   = c.r;
    data[i+1] = c.g;
    data[i+2] = c.b;
    data[i+3] = 255;
}

function equalColor(a,b){
    return (
        a.r===b.r &&
        a.g===b.g &&
        a.b===b.b
    );
}

function hexToRgb(hex){

    hex = hex.replace("#","");

    return {
        r: parseInt(hex.substring(0,2),16),
        g: parseInt(hex.substring(2,4),16),
        b: parseInt(hex.substring(4,6),16)
    };
}

</script>

</body>
</html>
