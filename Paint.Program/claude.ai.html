<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAINT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a1e;
    --panel: #111114;
    --border: #2e2e36;
    --text: #c8c8d4;
    --accent: #e8ff40;
    --tool-size: 52px;
    --palette-h: 72px;
    --nav-w: 68px;
    --topbar-h: 34px;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    user-select: none;
  }

  #app {
    display: grid;
    grid-template-columns: var(--nav-w) 1fr;
    grid-template-rows: var(--topbar-h) 1fr var(--palette-h);
    width: 100vw;
    height: 100vh;
  }

  /* ── TOP MENUBAR ── */
  #menubar {
    grid-column: 1 / 3;
    grid-row: 1;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 2px;
    z-index: 50;
  }

  .menu-item {
    position: relative;
  }

  .menu-btn {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 0 10px;
    height: var(--topbar-h);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .menu-btn:hover, .menu-btn.open { background: #22222c; color: var(--accent); }
  .menu-btn:disabled { color: #3a3a46; cursor: default; }
  .menu-btn:disabled:hover { background: transparent; color: #3a3a46; }

  .menu-btn .arrow {
    font-size: 8px;
    opacity: 0.5;
    margin-left: 2px;
  }

  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: #0f0f14;
    border: 1px solid var(--border);
    min-width: 140px;
    z-index: 200;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  }
  .dropdown.open { display: block; }

  .drop-item {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 8px 16px;
    text-align: left;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    white-space: nowrap;
  }
  .drop-item:hover { background: #1e1e28; color: var(--accent); }

  .menu-sep { height: 1px; background: var(--border); margin: 3px 0; }

  /* undo/redo as plain buttons in the bar */
  .bar-btn {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 0 10px;
    height: var(--topbar-h);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background 0.12s, color 0.12s;
  }
  .bar-btn:hover:not(:disabled) { background: #22222c; color: var(--accent); }
  .bar-btn:disabled { color: #3a3a46; cursor: default; }

  .bar-divider {
    width: 1px;
    height: 16px;
    background: var(--border);
    margin: 0 4px;
    flex-shrink: 0;
  }

  /* ── LEFT TOOLBAR ── */
  #toolbar {
    grid-column: 1;
    grid-row: 2 / 4;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 10px;
    gap: 6px;
    z-index: 10;
  }

  #toolbar .app-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--accent);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    margin-bottom: auto;
    margin-top: 8px;
    opacity: 0.7;
  }

  .tool-btn {
    width: var(--tool-size);
    height: var(--tool-size);
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    position: relative;
    flex-shrink: 0;
  }
  .tool-btn svg { pointer-events: none; }
  .tool-btn:hover { background: #22222a; border-color: #555; transform: scale(1.05); }
  .tool-btn.active {
    background: #262630;
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(232,255,64,0.3), inset 0 0 6px rgba(232,255,64,0.07);
  }
  .tool-btn.active svg * { stroke: var(--accent) !important; }
  .tool-btn .tooltip {
    position: absolute;
    left: calc(100% + 10px);
    top: 50%;
    transform: translateY(-50%);
    background: #0d0d10;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 10px;
    padding: 4px 8px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
    letter-spacing: 1px;
  }
  .tool-btn:hover .tooltip { opacity: 1; }

  /* size slider in toolbar */
  #size-wrap {
    width: var(--tool-size);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
  }
  #size-label {
    font-size: 9px;
    color: #555;
    letter-spacing: 1px;
  }
  #size-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 44px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    writing-mode: horizontal-tb;
    cursor: pointer;
  }
  #size-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* ── CANVAS AREA ── */
  #canvas-wrap {
    grid-column: 2;
    grid-row: 2;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 20px 20px;
    background-color: #111;
  }

  #main-canvas {
    position: absolute;
    top: 0; left: 0;
    cursor: crosshair;
    touch-action: none;
  }

  /* overlay canvas for live shape preview */
  #overlay-canvas {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }

  /* ── PALETTE ── */
  #palette-bar {
    grid-column: 2;
    grid-row: 3;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 5px 10px;
    gap: 8px;
    z-index: 10;
  }

  #current-color-box {
    width: 42px;
    height: 42px;
    border: 2px solid #555;
    border-radius: 4px;
    flex-shrink: 0;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    cursor: pointer;
    position: relative;
  }
  #current-color-box input[type=color] {
    position: absolute;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
    border: none;
    padding: 0;
  }

  #palette-grid {
    display: grid;
    grid-template-rows: 1fr 1fr;
    grid-auto-flow: column;
    gap: 3px;
    flex: 1;
    height: 52px;
  }

  .swatch {
    width: 24px;
    height: 100%;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
    flex-shrink: 0;
  }
  .swatch:hover { transform: scale(1.2); z-index: 1; border-color: #fff3; }
  .swatch.selected { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 4px rgba(255,255,255,0.5); }

  /* status bar */
  #status {
    position: absolute;
    bottom: 4px;
    right: 8px;
    font-size: 10px;
    color: #444;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="app">

  <!-- MENUBAR -->
  <div id="menubar">
    <!-- File menu -->
    <div class="menu-item" id="menu-file">
      <button class="menu-btn" id="file-btn">FILE <span class="arrow">▼</span></button>
      <div class="dropdown" id="file-dropdown">
        <button class="drop-item" id="cmd-new">NEW</button>
        <div class="menu-sep"></div>
        <button class="drop-item" id="cmd-open">OPEN</button>
        <div class="menu-sep"></div>
        <button class="drop-item" id="cmd-save">SAVE AS</button>
      </div>
    </div>

    <div class="bar-divider"></div>

    <!-- Undo / Redo as direct buttons (no dropdown) -->
    <button class="bar-btn" id="cmd-undo" disabled>↩ UNDO</button>
    <button class="bar-btn" id="cmd-redo" disabled>REDO ↪</button>
  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">
    <button class="tool-btn" data-tool="circle" title="">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="9" stroke="#888" stroke-width="1.8"/>
      </svg>
      <span class="tooltip">CIRCLE</span>
    </button>
    <button class="tool-btn" data-tool="rect" title="">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <rect x="4" y="6" width="18" height="14" rx="1" stroke="#888" stroke-width="1.8"/>
      </svg>
      <span class="tooltip">RECTANGLE</span>
    </button>
    <button class="tool-btn" data-tool="line" title="">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <line x1="4" y1="22" x2="22" y2="4" stroke="#888" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="tooltip">LINE</span>
    </button>
    <button class="tool-btn" data-tool="pen" title="">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M6 20 L18 5 L21 8 L9 23 Z" stroke="#888" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M6 20 L4 22 L8 21 Z" stroke="#888" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
      <span class="tooltip">PEN</span>
    </button>
    <button class="tool-btn" data-tool="brush" title="">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M8 18 Q10 14 14 10 L19 5 L21 7 L16 12 Q12 16 10 20" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="9" cy="19" rx="4" ry="3" transform="rotate(-30 9 19)" stroke="#888" stroke-width="1.4"/>
      </svg>
      <span class="tooltip">BRUSH</span>
    </button>
    <button class="tool-btn" data-tool="fill" title="">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M8 4 L8 16 Q8 20 12 20 Q16 20 16 16 Q16 12 12 12 L8 12" stroke="#888" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 4 L14 10" stroke="#888" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="3" stroke="#888" stroke-width="1.4"/>
        <path d="M17 20 Q13 17 14 10" stroke="#888" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <span class="tooltip">FILL BUCKET</span>
    </button>

    <div id="size-wrap">
      <div id="size-label">SIZE</div>
      <input type="range" id="size-slider" min="1" max="60" value="6">
      <div id="size-val" style="font-size:9px;color:#666">6</div>
    </div>

    <div class="app-title">PAINT</div>
  </div>

  <!-- CANVAS -->
  <div id="canvas-wrap">
    <canvas id="main-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
    <div id="status"></div>
  </div>

  <!-- PALETTE -->
  <div id="palette-bar">
    <div id="current-color-box">
      <input type="color" id="custom-color" value="#e8ff40">
    </div>
    <div id="palette-grid"></div>
  </div>

</div>

<script>
// ── PALETTE COLORS ──
const COLORS = [
  // row 1
  '#ffffff','#d4d4d4','#888888','#444444','#000000',
  '#ff2d2d','#ff6b2d','#ffd600','#a8ff3e','#2dffb4',
  '#2dd4ff','#2d7bff','#a64dff','#ff2db4','#ff8fa3',
  '#7c4000','#4a0000','#003d00','#001f4a','#1a001a',
  // row 2
  '#ffe8e8','#ffd0b0','#fff8cc','#e8ffcc','#ccffe8',
  '#ccf5ff','#cce0ff','#e8ccff','#ffcce8','#ffb3c1',
  '#ff9966','#ffcc00','#66ff99','#00ccff','#cc66ff',
  '#ff3399','#00ffcc','#ff6600','#0099ff','#99ff00',
];

// ── BUILD PALETTE ──
const grid = document.getElementById('palette-grid');
let activeColor = '#e8ff40';

COLORS.forEach(c => {
  const sw = document.createElement('div');
  sw.className = 'swatch';
  sw.style.background = c;
  sw.dataset.color = c;
  if (c === activeColor) sw.classList.add('selected');
  sw.addEventListener('click', () => selectColor(c));
  grid.appendChild(sw);
});

const colorBox = document.getElementById('current-color-box');
const customColor = document.getElementById('custom-color');
colorBox.style.background = activeColor;

function selectColor(c) {
  activeColor = c;
  colorBox.style.background = c;
  customColor.value = (c.length === 7) ? c : '#000000';
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
  const match = document.querySelector(`.swatch[data-color="${c}"]`);
  if (match) match.classList.add('selected');
}

customColor.addEventListener('input', () => {
  selectColor(customColor.value);
});

// ── TOOL STATE ──
let activeTool = 'pen';
let brushSize = 6;

document.querySelectorAll('.tool-btn').forEach(btn => {
  const t = btn.dataset.tool;
  if (t === activeTool) btn.classList.add('active');
  btn.addEventListener('click', () => {
    if (activeTool === t) {
      // deselect
      activeTool = null;
      btn.classList.remove('active');
    } else {
      activeTool = t;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  });
});

const sizeSlider = document.getElementById('size-slider');
const sizeVal = document.getElementById('size-val');
sizeSlider.addEventListener('input', () => {
  brushSize = parseInt(sizeSlider.value);
  sizeVal.textContent = brushSize;
});

// ── CANVAS SETUP ──
const wrap = document.getElementById('canvas-wrap');
const canvas = document.getElementById('main-canvas');
const overlay = document.getElementById('overlay-canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const octx = overlay.getContext('2d');
const status = document.getElementById('status');

function resize() {
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  // save content
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  canvas.width = w; canvas.height = h;
  overlay.width = w; overlay.height = h;
  // fill white
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  ctx.putImageData(img, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// init white fill
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, canvas.width, canvas.height);

// ── DRAWING STATE ──
let drawing = false;
let startX, startY, lastX, lastY;
let brushPoints = [];

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: src.clientX - r.left, y: src.clientY - r.top };
}

// ── BRUSH HELPERS ──
function drawBrushStroke(x, y) {
  const count = Math.floor(brushSize * 1.5) + 4;
  ctx.save();
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spread = (Math.random() * brushSize * 0.7);
    const bx = x + Math.cos(angle) * spread;
    const by = y + Math.sin(angle) * spread;
    const len = brushSize * (0.5 + Math.random() * 1.2);
    const angle2 = angle + (Math.random() - 0.5) * 1.2;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + Math.cos(angle2) * len, by + Math.sin(angle2) * len);
    ctx.strokeStyle = activeColor;
    ctx.lineWidth = Math.random() * 2 + 0.5;
    ctx.globalAlpha = 0.3 + Math.random() * 0.5;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  ctx.restore();
}

// ── FLOOD FILL ──
function floodFill(sx, sy, fillColor) {
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  const w = canvas.width, h = canvas.height;

  const idx = (x, y) => (y * w + x) * 4;
  const ti = idx(Math.floor(sx), Math.floor(sy));
  const tr = data[ti], tg = data[ti+1], tb = data[ti+2], ta = data[ti+3];

  const fr = parseInt(fillColor.slice(1,3), 16);
  const fg = parseInt(fillColor.slice(3,5), 16);
  const fb = parseInt(fillColor.slice(5,7), 16);

  if (tr === fr && tg === fg && tb === fb) return;

  const match = (i) =>
    Math.abs(data[i] - tr) < 30 &&
    Math.abs(data[i+1] - tg) < 30 &&
    Math.abs(data[i+2] - tb) < 30 &&
    Math.abs(data[i+3] - ta) < 30;

  const stack = [[ Math.floor(sx), Math.floor(sy) ]];
  const visited = new Uint8Array(w * h);

  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (cx < 0 || cy < 0 || cx >= w || cy >= h) continue;
    const ci = cy * w + cx;
    if (visited[ci]) continue;
    visited[ci] = 1;
    const pi = ci * 4;
    if (!match(pi)) continue;
    data[pi] = fr; data[pi+1] = fg; data[pi+2] = fb; data[pi+3] = 255;
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  ctx.putImageData(imgData, 0, 0);
}

// ── SHAPE OVERLAY ──
function drawOverlayShape(ex, ey) {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  octx.strokeStyle = activeColor;
  octx.lineWidth = brushSize;
  octx.lineCap = 'round';
  octx.lineJoin = 'round';

  if (activeTool === 'circle') {
    const rx = (ex - startX) / 2;
    const ry = (ey - startY) / 2;
    octx.beginPath();
    octx.ellipse(startX + rx, startY + ry, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI * 2);
    octx.stroke();
  } else if (activeTool === 'rect') {
    octx.beginPath();
    octx.strokeRect(startX, startY, ex - startX, ey - startY);
  } else if (activeTool === 'line') {
    octx.beginPath();
    octx.moveTo(startX, startY);
    octx.lineTo(ex, ey);
    octx.stroke();
  }
}

// ── POINTER DOWN ──
canvas.addEventListener('pointerdown', e => {
  if (!activeTool) return;
  drawing = true;
  const { x, y } = getPos(e);
  startX = x; startY = y;
  lastX = x; lastY = y;
  canvas.setPointerCapture(e.pointerId);

  if (activeTool === 'fill') {
    floodFill(x, y, activeColor);
    drawing = false;
    return;
  }
  if (activeTool === 'pen') {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.strokeStyle = activeColor;
    ctx.lineWidth = brushSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // dot
    ctx.arc(x, y, brushSize/2, 0, Math.PI*2);
    ctx.fillStyle = activeColor;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }
  if (activeTool === 'brush') {
    drawBrushStroke(x, y);
  }
});

// ── POINTER MOVE ──
canvas.addEventListener('pointermove', e => {
  const { x, y } = getPos(e);
  status.textContent = `${Math.round(x)}, ${Math.round(y)}`;
  if (!drawing || !activeTool) return;

  if (activeTool === 'pen') {
    ctx.lineTo(x, y);
    ctx.strokeStyle = activeColor;
    ctx.lineWidth = brushSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  } else if (activeTool === 'brush') {
    // interpolate for smoother strokes
    const dx = x - lastX, dy = y - lastY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const steps = Math.max(1, Math.floor(dist / 4));
    for (let i = 0; i <= steps; i++) {
      const px = lastX + (dx * i / steps);
      const py = lastY + (dy * i / steps);
      drawBrushStroke(px, py);
    }
    lastX = x; lastY = y;
  } else if (['circle','rect','line'].includes(activeTool)) {
    drawOverlayShape(x, y);
  }
});

// ── POINTER UP ──
function finishDraw(e) {
  if (!drawing) return;
  drawing = false;
  const { x, y } = e.touches
    ? { x: e.changedTouches[0].clientX - canvas.getBoundingClientRect().left,
        y: e.changedTouches[0].clientY - canvas.getBoundingClientRect().top }
    : getPos(e);

  if (['circle','rect','line'].includes(activeTool)) {
    octx.clearRect(0, 0, overlay.width, overlay.height);
    ctx.strokeStyle = activeColor;
    ctx.lineWidth = brushSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (activeTool === 'circle') {
      const rx = (x - startX) / 2;
      const ry = (y - startY) / 2;
      ctx.beginPath();
      ctx.ellipse(startX + rx, startY + ry, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (activeTool === 'rect') {
      ctx.beginPath();
      ctx.strokeRect(startX, startY, x - startX, y - startY);
    } else if (activeTool === 'line') {
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
  }
}

canvas.addEventListener('pointerup', finishDraw);
canvas.addEventListener('pointerleave', e => { if (drawing) finishDraw(e); });

// cursor style per tool
function updateCursor() {
  if (!activeTool) { canvas.style.cursor = 'default'; return; }
  if (activeTool === 'fill') canvas.style.cursor = 'cell';
  else if (activeTool === 'pen' || activeTool === 'brush') canvas.style.cursor = 'crosshair';
  else canvas.style.cursor = 'crosshair';
}
document.querySelectorAll('.tool-btn').forEach(b => b.addEventListener('click', updateCursor));
updateCursor();

// activate pen by default
document.querySelector('[data-tool="pen"]').classList.add('active');

// ── UNDO / REDO ──
const undoStack = [];
const redoStack = [];
const MAX_HISTORY = 40;

function saveState() {
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
  updateHistoryBtns();
}

function updateHistoryBtns() {
  document.getElementById('cmd-undo').disabled = undoStack.length === 0;
  document.getElementById('cmd-redo').disabled = redoStack.length === 0;
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  ctx.putImageData(undoStack.pop(), 0, 0);
  updateHistoryBtns();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  ctx.putImageData(redoStack.pop(), 0, 0);
  updateHistoryBtns();
}

document.getElementById('cmd-undo').addEventListener('click', undo);
document.getElementById('cmd-redo').addEventListener('click', redo);

// keyboard shortcuts
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
});

// save state before each stroke completes
const _origPointerDown = canvas.onpointerdown;
canvas.addEventListener('pointerdown', () => { saveState(); }, true);

// ── FILE MENU ──
// toggle dropdown
const fileBtn = document.getElementById('file-btn');
const fileDropdown = document.getElementById('file-dropdown');
fileBtn.addEventListener('click', e => {
  e.stopPropagation();
  const open = fileDropdown.classList.toggle('open');
  fileBtn.classList.toggle('open', open);
});
document.addEventListener('click', () => {
  fileDropdown.classList.remove('open');
  fileBtn.classList.remove('open');
});

// NEW
document.getElementById('cmd-new').addEventListener('click', () => {
  if (confirm('Start a new canvas? Unsaved work will be lost.')) {
    saveState();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  fileDropdown.classList.remove('open');
  fileBtn.classList.remove('open');
});

// OPEN
const fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = 'image/*';
fileInput.style.display = 'none';
document.body.appendChild(fileInput);

document.getElementById('cmd-open').addEventListener('click', () => {
  fileInput.click();
  fileDropdown.classList.remove('open');
  fileBtn.classList.remove('open');
});
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      saveState();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

// SAVE AS
document.getElementById('cmd-save').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'painting.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  fileDropdown.classList.remove('open');
  fileBtn.classList.remove('open');
});
</script>
</body>
</html>
