<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tic Tac Toe</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #1f2937, #0b1220);
        font-family: Arial, sans-serif;
        color: #fff;
    }

    .game {
        text-align: center;
    }

    h1 {
        margin-bottom: 10px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .board {
        display: grid;
        grid-template-columns: repeat(3, 110px);
        grid-template-rows: repeat(3, 110px);
        gap: 10px;
        margin-top: 20px;
    }

    .cell {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2.5rem;
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
    }

    .cell:hover {
        background: rgba(255,255,255,0.12);
        transform: scale(1.03);
    }

    .cell.x {
        color: #60a5fa;
    }

    .cell.o {
        color: #f87171;
    }

    .status {
        margin-top: 15px;
        font-size: 14px;
        opacity: 0.8;
    }

    button {
        margin-top: 15px;
        padding: 8px 14px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        background: #2563eb;
        color: white;
    }

    button:hover {
        background: #1d4ed8;
    }
</style>
</head>

<body>
<div class="game">
    <h1>Tic Tac Toe</h1>
    <div class="status" id="status">Your turn (X)</div>

    <div class="board" id="board"></div>

    <button onclick="resetGame()">Reset</button>
</div>

<script>
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

let board = Array(9).fill(null);
let playerTurn = true;

function init() {
    boardEl.innerHTML = "";
    board.forEach((_, i) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.index = i;
        cell.addEventListener("click", handleMove);
        boardEl.appendChild(cell);
    });
}

function handleMove(e) {
    const i = e.target.dataset.index;

    if (!playerTurn || board[i]) return;

    makeMove(i, "X");
    if (!checkEnd()) {
        playerTurn = false;
        statusEl.textContent = "Computer thinking...";

        setTimeout(computerMove, 400);
    }
}

function computerMove() {
    let empty = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
    let choice = empty[Math.floor(Math.random() * empty.length)];

    makeMove(choice, "O");

    checkEnd();
    playerTurn = true;
    statusEl.textContent = "Your turn (X)";
}

function makeMove(i, symbol) {
    board[i] = symbol;
    const cell = boardEl.children[i];
    cell.textContent = symbol;
    cell.classList.add(symbol.toLowerCase());
}

function checkEnd() {
    const wins = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    for (let w of wins) {
        const [a,b,c] = w;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            statusEl.textContent = board[a] + " wins!";
            playerTurn = false;
            return true;
        }
    }

    if (!board.includes(null)) {
        statusEl.textContent = "Draw!";
        playerTurn = false;
        return true;
    }

    return false;
}

function resetGame() {
    board = Array(9).fill(null);
    playerTurn = true;
    statusEl.textContent = "Your turn (X)";
    init();
}

init();
</script>
</body>
</html>
